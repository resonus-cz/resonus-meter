# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
[graph]
all-features = true

[advisories]
# Unmaintained crates are reported only when we depend on them directly.
unmaintained = "workspace"

[licenses]
# Licences compatible with distributing the application under AGPL-3.0-only (ADR 0016).
allow = [
    "AGPL-3.0-only",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal workspace crates are referenced by path without a version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
