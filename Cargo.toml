[workspace]
members = [
    "crates/spl-dsp",
    "crates/spl-audio",
    "crates/spl-session",
    "crates/spl-engine",
    "crates/spl-app",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-only"
repository = "https://github.com/resonus-cz/resonus-meter"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[workspace.dependencies]
adw = { package = "libadwaita", version = "0.8", features = ["v1_6"] }
cpal = { version = "0.18.2", features = ["pipewire", "pulseaudio"] }
gtk = { package = "gtk4", version = "0.10", features = ["v4_10"] }
# Pango >= 1.56: register the bundled Lexend files (ADR 0017).
pango = { version = "0.21", features = ["v1_56"] }
pangocairo = "0.21"
thiserror = "2"
rtrb = "0.4"
csv = "1.3"
time = "0.3.36"
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
proptest = "1.7"
